<!DOCTYPE html>
<html>
<head>
    <title>Edit Employee</title>
</head>
<body>
    <h1>Edit Employee</h1>
    <form method="POST">
        <input type="text" name="emp_name" placeholder="Employee Name" value="{{ emp[1] }}" required><br>
        <input type="email" name="email" placeholder="Email" value="{{ emp[2] }}" required><br>
        <input type="text" name="phone" placeholder="Phone" value="{{ emp[3] }}"><br>
        <input type="number" name="dept_id" placeholder="Department ID" value="{{ emp[4] }}"><br>
        <input type="text" name="role_" placeholder="Position" value="{{ emp[5] }}"><br>
        <input type="number" step="0.01" name="salary" placeholder="Salary" value="{{ emp[6] }}"><br>
        <input type="date" name="hire_date" value="{{ emp[7] }}"><br>
        <input type="text" name="status" placeholder="Status" value="{{ emp[8] }}"><br>
        <button type="submit">Update</button>
    </form>
    <a href="{{ url_for('index') }}">Back</a>
</body>
</html>
