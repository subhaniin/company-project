{% extends "base.html" %}
{% block title %}Add Employee{% endblock %}

{% block content %}
  <div class="hero" style="margin-top:8px;">
    <h1>Add Employee</h1>
    <p class="subtitle">Create a new employee record</p>

    <div class="form-card" style="margin-top:18px;">
      <form method="POST" class="form-row" autocomplete="off" novalidate>
        <div class="form-group full">
          <label class="text-muted" for="emp_name">Full name</label>
          <input id="emp_name" class="input" name="emp_name" placeholder="Full name" required>
        </div>

        <div class="form-group full">
          <label class="text-muted" for="email">Email</label>
          <input id="email" class="input" name="email" type="email" placeholder="name@example.com" required>
        </div>

        <div class="form-group">
          <label class="text-muted" for="phone">Phone</label>
          <input id="phone" class="input" name="phone" placeholder="9876543210">
        </div>

        <div class="form-group">
          <label class="text-muted" for="dept_id">Dept ID</label>
          <input id="dept_id" class="input" name="dept_id" placeholder="Department ID">
        </div>

        <div class="form-group">
          <label class="text-muted" for="role_">Role / Position</label>
          <input id="role_" class="input" name="role_" placeholder="Position">
        </div>

        <div class="form-group">
          <label class="text-muted" for="salary">Salary</label>
          <input id="salary" class="input" name="salary" placeholder="Salary">
        </div>

        <div class="form-group">
          <label class="text-muted" for="hire_date">Hire date</label>
          <input id="hire_date" class="input" name="hire_date" placeholder="YYYY-MM-DD">
        </div>

        <div class="form-group">
          <label class="text-muted" for="status">Status</label>
          <input id="status" class="input" name="status" placeholder="Active / Inactive">
        </div>

        <!-- If you prefer the Save button to be in-line as last element,
             you can add a .form-group with minimal width. -->
        <div style="flex:0 0 auto; display:flex; align-items:center;">
          <button class="btn btn-primary" type="submit">Save</button>
        </div>
      </form>

      <div class="form-actions">
        <a class="btn btn-ghost" href="{{ url_for('index') }}">Cancel</a>
      </div>
    </div>
  </div>
{% endblock %}
