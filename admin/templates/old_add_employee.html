<!DOCTYPE html>
<html>
<head>
    <title>Add Employee</title>
</head>
<body>
    <h1>Add Employee</h1>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <ul>
          {% for message in messages %}
            <li>{{ message }}</li>
          {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}

    <form method="POST">
        <input type="text" name="emp_name" placeholder="Employee Name" required><br>
        <input type="email" name="email" placeholder="Email" required><br>
        <input type="text" name="phone" placeholder="Phone"><br>
        <input type="number" name="dept_id" placeholder="Department ID"><br>
        <input type="text" name="role_" placeholder="Position"><br>
        <input type="number" step="0.01" name="salary" placeholder="Salary"><br>
        <input type="date" name="hire_date"><br>
        <input type="text" name="status" placeholder="Status"><br>
        <button type="submit">Add Employee</button>
    </form>
    <a href="{{ url_for('index') }}">Back to Search</a>
</body>
</html>
