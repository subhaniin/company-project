{% extends "base.html" %}
{% block title %}Edit Employee{% endblock %}

{% block content %}
  <div class="hero" style="margin-top:8px;">
    <h1>Edit Employee</h1>
    <p class="subtitle">Update employee details</p>

    <div class="form-card" style="margin-top:18px;">
      <form method="POST" class="form-row" autocomplete="off" novalidate>
        <div class="form-group full">
          <label class="text-muted" for="emp_name">Full name</label>
          <input id="emp_name" class="input" name="emp_name" value="{{ emp[1] }}" required>
        </div>

        <div class="form-group full">
          <label class="text-muted" for="email">Email</label>
          <input id="email" class="input" name="email" value="{{ emp[2] }}" type="email" required>
        </div>

        <div class="form-group">
          <label class="text-muted" for="phone">Phone</label>
          <input id="phone" class="input" name="phone" value="{{ emp[3] }}">
        </div>

        <div class="form-group">
          <label class="text-muted" for="dept_id">Dept ID</label>
          <input id="dept_id" class="input" name="dept_id" value="{{ emp[4] }}">
        </div>

        <div class="form-group">
          <label class="text-muted" for="role_">Role / Position</label>
          <input id="role_" class="input" name="role_" value="{{ emp[5] }}">
        </div>

        <div class="form-group">
          <label class="text-muted" for="salary">Salary</label>
          <input id="salary" class="input" name="salary" value="{{ emp[6] }}">
        </div>

        <div class="form-group">
          <label class="text-muted" for="hire_date">Hire date</label>
          <input id="hire_date" class="input" name="hire_date" value="{{ emp[7] }}">
        </div>

        <div class="form-group">
          <label class="text-muted" for="status">Status</label>
          <input id="status" class="input" name="status" value="{{ emp[8] }}">
        </div>

        <div style="flex:0 0 auto; display:flex; align-items:center;">
          <button class="btn btn-primary" type="submit">Update</button>
        </div>
      </form>

      <div class="form-actions">
        <a class="btn btn-ghost" href="{{ url_for('index') }}">Cancel</a>
      </div>
    </div>
  </div>
{% endblock %}
